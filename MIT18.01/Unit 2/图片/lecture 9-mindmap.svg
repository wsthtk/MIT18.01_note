<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="720" fill="#ffffff"/>

  <g fill="none" stroke-linecap="round">
    <!-- main trunk to 5 branches -->
    <path d="M240 360 C 290 360, 290 85, 340 85" stroke="#2563eb" stroke-width="2.6"/>
    <path d="M240 360 C 290 360, 290 220, 340 220" stroke="#ea580c" stroke-width="2.6"/>
    <path d="M240 360 L 340 360" stroke="#0d9488" stroke-width="2.6"/>
    <path d="M240 360 C 290 360, 290 500, 340 500" stroke="#7c3aed" stroke-width="2.6"/>
    <path d="M240 360 C 290 360, 290 635, 340 635" stroke="#e11d48" stroke-width="2.6"/>

    <!-- blue leaves (Session 23 本质) -->
    <g stroke="#2563eb" stroke-width="1.8">
      <path d="M530 85 C 570 85, 580 50, 620 50"/>
      <path d="M530 85 C 570 85, 580 85, 620 85"/>
      <path d="M530 85 C 570 85, 580 120, 620 120"/>
    </g>
    <!-- orange leaves (五大基础一阶展开) -->
    <g stroke="#ea580c" stroke-width="1.8">
      <path d="M530 220 C 570 220, 580 185, 620 185"/>
      <path d="M530 220 C 570 220, 580 220, 620 220"/>
      <path d="M530 220 C 570 220, 580 255, 620 255"/>
    </g>
    <!-- teal leaves (Session 24 技巧与应用) -->
    <g stroke="#0d9488" stroke-width="1.8">
      <path d="M530 360 C 570 360, 580 325, 620 325"/>
      <path d="M530 360 C 570 360, 580 360, 620 360"/>
      <path d="M530 360 C 570 360, 580 395, 620 395"/>
    </g>
    <!-- purple leaves (Session 25 二次近似) -->
    <g stroke="#7c3aed" stroke-width="1.8">
      <path d="M530 500 C 570 500, 580 465, 620 465"/>
      <path d="M530 500 C 570 500, 580 500, 620 500"/>
      <path d="M530 500 C 570 500, 580 535, 620 535"/>
    </g>
    <!-- red leaves (误差与适用原则) -->
    <g stroke="#e11d48" stroke-width="1.8">
      <path d="M530 635 C 570 635, 580 605, 620 605"/>
      <path d="M530 635 C 570 635, 580 635, 620 635"/>
      <path d="M530 635 C 570 635, 580 665, 620 665"/>
    </g>
  </g>

  <!-- center node -->
  <g filter="url(#shadow)">
    <rect x="30" y="315" width="210" height="90" rx="14" fill="#0f172a"/>
  </g>
  <text x="135" y="345" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">MIT 18.01SC Lecture 9</text>
  <text x="135" y="370" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">线性近似与二次近似</text>
  <text x="135" y="390" fill="#94a3b8" font-size="11" text-anchor="middle">Linear &amp; Quadratic Approx</text>

  <!-- Branch 1: Blue -->
  <g filter="url(#shadow)">
    <rect x="340" y="60" width="190" height="50" rx="10" fill="#2563eb"/>
  </g>
  <text x="435" y="82" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Session 23 线性近似本质</text>
  <text x="435" y="99" fill="#bfdbfe" font-size="11" text-anchor="middle">切线逼近 / 局部线性化</text>

  <g filter="url(#shadow)">
    <rect x="620" y="36" width="340" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="630" y="55" fill="#1e40af" font-size="11">切线公式：f(x) ≈ f(x₀) + f'(x₀)(x - x₀)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="71" width="340" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="630" y="90" fill="#1e40af" font-size="11">导数反读：Δf ≈ f'(x₀)Δx（平均变化率逼近瞬时）</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="106" width="340" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="630" y="125" fill="#1e40af" font-size="11">基准点选择：ln x 在 x₀=1 处为 ln x ≈ x - 1</text>
  </g>

  <!-- Branch 2: Orange -->
  <g filter="url(#shadow)">
    <rect x="340" y="195" width="190" height="50" rx="10" fill="#ea580c"/>
  </g>
  <text x="435" y="217" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">五大基础展开库 (x ≈ 0)</text>
  <text x="435" y="234" fill="#fed7aa" font-size="11" text-anchor="middle">Standard Approximations</text>

  <g filter="url(#shadow)">
    <rect x="620" y="171" width="340" height="28" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="630" y="190" fill="#9a3412" font-size="11">三角函数：sin x ≈ x，cos x ≈ 1</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="206" width="340" height="28" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="630" y="225" fill="#9a3412" font-size="11">指数与对数：eˣ ≈ 1 + x，ln(1+x) ≈ x</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="241" width="340" height="28" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="630" y="260" fill="#9a3412" font-size="11">二项式幂：(1+x)ʳ ≈ 1 + rx (如 1/√(1+x) ≈ 1 - x/2)</text>
  </g>

  <!-- Branch 3: Teal -->
  <g filter="url(#shadow)">
    <rect x="340" y="335" width="190" height="50" rx="10" fill="#0d9488"/>
  </g>
  <text x="435" y="357" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Session 24 技巧与应用</text>
  <text x="435" y="374" fill="#ccfbf1" font-size="11" text-anchor="middle">代数组合 / 相对论误差</text>

  <g filter="url(#shadow)">
    <rect x="620" y="311" width="340" height="28" rx="6" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
    <text x="630" y="330" fill="#115e59" font-size="11">忽略高阶项：乘法直接丢弃 O(x²)，化繁为简</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="346" width="340" height="28" rx="6" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
    <text x="630" y="365" fill="#115e59" font-size="11">反向读导数：由近似展开直接得 f'(0)，免商法则</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="381" width="340" height="28" rx="6" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1"/>
    <text x="630" y="400" fill="#115e59" font-size="11">物理工程：GPS 钟慢相对误差 ΔT/T ≈ (1/2)(v²/c²)</text>
  </g>

  <!-- Branch 4: Purple -->
  <g filter="url(#shadow)">
    <rect x="340" y="475" width="190" height="50" rx="10" fill="#7c3aed"/>
  </g>
  <text x="435" y="497" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Session 25 二次近似与二阶导</text>
  <text x="435" y="514" fill="#e9d5ff" font-size="11" text-anchor="middle">拟合抛物线 / 曲率校正</text>

  <g filter="url(#shadow)">
    <rect x="620" y="451" width="340" height="28" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="630" y="470" fill="#581c87" font-size="11">公式：f(x) ≈ f(x₀) + f'(x₀)Δx + ½ f''(x₀)(Δx)²</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="486" width="340" height="28" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="630" y="505" fill="#581c87" font-size="11">系数 ½ 的来源：匹配二阶导 Q''(0) = 2c = f''(0)</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="521" width="340" height="28" rx="6" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="630" y="540" fill="#581c87" font-size="11">经典二次修正：cos x ≈ 1 - x²/2，eˣ ≈ 1+x+x²/2</text>
  </g>

  <!-- Branch 5: Red -->
  <g filter="url(#shadow)">
    <rect x="340" y="610" width="190" height="50" rx="10" fill="#e11d48"/>
  </g>
  <text x="435" y="632" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">精度边界与易错辨析</text>
  <text x="435" y="649" fill="#fecdd3" font-size="11" text-anchor="middle">适用范围 / 凹凸性与余项</text>

  <g filter="url(#shadow)">
    <rect x="620" y="591" width="340" height="28" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="630" y="610" fill="#9f1239" font-size="11">有效范围：仅限近距离逼近，远距离误差失控</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="621" width="340" height="28" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="630" y="640" fill="#9f1239" font-size="11">凹凸性判定：f''&gt;0 切线在下方(欠估计)，二次项补足</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="651" width="340" height="28" rx="6" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="630" y="670" fill="#9f1239" font-size="11">远期衔接：泰勒级数初步 (Taylor Series with Remainder)</text>
  </g>
</svg>
