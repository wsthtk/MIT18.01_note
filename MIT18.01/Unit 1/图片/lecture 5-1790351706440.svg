<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 930" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1430" height="930" fill="#ffffff"/>

  <!-- ============ 连接线（先画，使节点压在线端之上） ============ -->
  <g fill="none" stroke-linecap="round">
    <!-- 根节点 → 三个 Session -->
    <path d="M290 465 C 328 465, 322 175, 360 175" stroke="#2563eb" stroke-width="2.6"/>
    <path d="M290 465 L 360 465" stroke="#ea580c" stroke-width="2.6"/>
    <path d="M290 465 C 328 465, 322 755, 360 755" stroke="#0d9488" stroke-width="2.6"/>

    <!-- Session 13 → 二级节点 -->
    <g stroke="#2563eb" stroke-width="1.9">
      <path d="M590 175 C 626 175, 644 60, 680 60"/>
      <path d="M590 175 C 626 175, 644 106, 680 106"/>
      <path d="M590 175 C 626 175, 644 198, 680 198"/>
      <path d="M590 175 C 626 175, 644 290, 680 290"/>
    </g>
    <!-- Session 14 → 二级节点 -->
    <g stroke="#ea580c" stroke-width="1.9">
      <path d="M590 465 C 626 465, 644 373, 680 373"/>
      <path d="M590 465 C 626 465, 644 442, 680 442"/>
      <path d="M590 465 C 626 465, 644 511, 680 511"/>
      <path d="M590 465 C 626 465, 644 580, 680 580"/>
    </g>
    <!-- Session 15 → 二级节点 -->
    <g stroke="#0d9488" stroke-width="1.9">
      <path d="M590 755 C 626 755, 644 640, 680 640"/>
      <path d="M590 755 C 626 755, 644 686, 680 686"/>
      <path d="M590 755 C 626 755, 644 732, 680 732"/>
      <path d="M590 755 C 626 755, 644 778, 680 778"/>
      <path d="M590 755 C 626 755, 644 824, 680 824"/>
      <path d="M590 755 C 626 755, 644 870, 680 870"/>
    </g>

    <!-- 二级父节点 → 三级节点 -->
    <g stroke="#2563eb" stroke-width="1.6" opacity="0.75">
      <path d="M890 198 C 940 198, 960 152, 1010 152"/>
      <path d="M890 198 L 1010 198"/>
      <path d="M890 198 C 940 198, 960 244, 1010 244"/>
      <path d="M890 290 L 1010 290"/>
    </g>
    <g stroke="#ea580c" stroke-width="1.6" opacity="0.75">
      <path d="M890 373 C 940 373, 960 350, 1010 350"/>
      <path d="M890 373 C 940 373, 960 396, 1010 396"/>
      <path d="M890 511 C 940 511, 960 488, 1010 488"/>
      <path d="M890 511 C 940 511, 960 534, 1010 534"/>
    </g>
  </g>

  <!-- ============ 根节点 ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="430" width="250" height="70" rx="12" fill="#0f172a"/>
  </g>
  <text x="165" y="460" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">Session 13–15</text>
  <text x="165" y="487" text-anchor="middle" fill="#e2e8f0" font-size="16.5" font-weight="600">隐函数求导与反函数</text>

  <!-- ============ 一级节点 ============ -->
  <g filter="url(#shadow)">
    <rect x="360" y="147" width="230" height="56" rx="10" fill="#2563eb"/>
    <rect x="360" y="437" width="230" height="56" rx="10" fill="#ea580c"/>
    <rect x="360" y="727" width="230" height="56" rx="10" fill="#0d9488"/>
  </g>
  <g text-anchor="middle" fill="#ffffff">
    <text x="475" y="170" font-size="16.5" font-weight="700">Session 13 · 隐函数求导</text>
    <text x="475" y="192" font-size="11.5" fill="#dbeafe">Implicit Differentiation</text>
    <text x="475" y="460" font-size="16.5" font-weight="700">Session 14 · 隐函数求导例题</text>
    <text x="475" y="482" font-size="11.5" fill="#ffedd5">Worked Examples</text>
    <text x="475" y="750" font-size="16.5" font-weight="700">Session 15 · 反函数</text>
    <text x="475" y="772" font-size="11.5" fill="#ccfbf1">Inverse Functions</text>
  </g>

  <!-- ============ Session 13 二级节点 ============ -->
  <g>
    <rect x="680" y="40" width="320" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="680" y="86" width="320" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="680" y="178" width="210" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="680" y="270" width="210" height="40" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <g fill="#1e293b" font-size="13.5">
    <text x="694" y="60" dominant-baseline="central" font-weight="600">核心：链式法则（Chain Rule）的应用</text>
    <text x="694" y="106" dominant-baseline="central">显式函数（explicit） vs 隐式关系（implicit）</text>
    <text x="694" y="198" dominant-baseline="central" font-weight="700" fill="#1d4ed8">三步流程</text>
    <text x="694" y="290" dominant-baseline="central" font-weight="700" fill="#1d4ed8">有理指数幂法则</text>
  </g>

  <!-- ============ Session 13 三级节点 ============ -->
  <g>
    <rect x="1010" y="132" width="400" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="1010" y="178" width="400" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="1010" y="224" width="400" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="1010" y="270" width="400" height="40" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>
  <g fill="#334155" font-size="13.5">
    <text x="1024" y="152" dominant-baseline="central">① 两边对 x 求导，含 y 的项乘 y′</text>
    <text x="1024" y="198" dominant-baseline="central">② 收集含 y′ 的项到同一侧</text>
    <text x="1024" y="244" dominant-baseline="central">③ 提出 y′，解出</text>
    <text x="1024" y="290" dominant-baseline="central">d/dx x^(m/n) = (m/n) · x^(m/n − 1)</text>
  </g>

  <!-- ============ Session 14 二级节点 ============ -->
  <g>
    <rect x="680" y="353" width="210" height="40" rx="8" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="680" y="422" width="320" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="680" y="491" width="210" height="40" rx="8" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/>
    <rect x="680" y="560" width="320" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  </g>
  <g fill="#1e293b" font-size="13.5">
    <text x="694" y="373" dominant-baseline="central" font-weight="700" fill="#c2410c">单位圆 x² + y² = 1</text>
    <text x="694" y="442" dominant-baseline="central">y⁴ + xy² − 2 = 0 → y′ = −y²/(4y³+2xy)</text>
    <text x="694" y="511" dominant-baseline="central" font-weight="700" fill="#c2410c">椭圆 x² + 4y² = 1（二阶导）</text>
    <text x="694" y="580" dominant-baseline="central">双曲线 y² − x² = 1 → y′ = x/y</text>
  </g>

  <!-- ============ Session 14 三级节点 ============ -->
  <g>
    <rect x="1010" y="330" width="400" height="40" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="1010" y="376" width="400" height="40" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="1010" y="468" width="400" height="40" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect x="1010" y="514" width="400" height="40" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  </g>
  <g fill="#334155" font-size="13.5">
    <text x="1024" y="350" dominant-baseline="central">直接法：y′ = −x / √(1−x²)</text>
    <text x="1024" y="396" dominant-baseline="central">隐式法：y′ = −x / y</text>
    <text x="1024" y="488" dominant-baseline="central">y′ = −x / (4y)</text>
    <text x="1024" y="534" dominant-baseline="central">y″ = −1 / (16y³)</text>
  </g>

  <!-- ============ Session 15 二级节点（全部为末端） ============ -->
  <g>
    <rect x="680" y="620" width="320" height="40" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="680" y="666" width="320" height="40" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="680" y="712" width="320" height="40" rx="8" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="680" y="758" width="320" height="40" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="680" y="804" width="320" height="40" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="680" y="850" width="320" height="40" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  </g>
  <g fill="#1e293b" font-size="13.5">
    <text x="694" y="640" dominant-baseline="central">反函数定义：g(f(x)) = x，g = f⁻¹</text>
    <text x="694" y="686" dominant-baseline="central">图像：关于直线 y = x 对称</text>
    <text x="694" y="732" dominant-baseline="central" font-weight="700" fill="#0f766e">求导公式：dx/dy = 1 / (dy/dx)</text>
    <text x="694" y="778" dominant-baseline="central">(arctan x)′ = 1 / (1 + x²)</text>
    <text x="694" y="824" dominant-baseline="central">(arcsin x)′ = 1 / √(1−x²)</text>
    <text x="694" y="870" dominant-baseline="central">(√x)′ = 1 / (2√x)</text>
  </g>
</svg>
