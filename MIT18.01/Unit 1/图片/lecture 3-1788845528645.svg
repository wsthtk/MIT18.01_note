<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 736" width="100%" style="max-width:800px;" font-family="'Segoe UI','Microsoft YaHei',-apple-system,sans-serif"><rect x="14" y="336.0" rx="9" width="196" height="60" fill="#263238"/><text x="112.0" y="360.0" font-size="14.5" fill="#fff" text-anchor="middle" font-weight="bold">Session 8</text><text x="112.0" y="380.0" font-size="14.5" fill="#fff" text-anchor="middle" font-weight="bold">三角函数导数的几何基础</text><path d="M 210.0,366.0 C 221.0,366.0 221.0,99.0 232.0,99.0" fill="none" stroke="#2b6cb0" stroke-width="1.7"/><rect x="232" y="83.0" rx="8" width="178" height="32" fill="#2b6cb0"/><text x="321.0" y="104.0" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold">关键极限 1</text><rect x="436" y="30.0" rx="7" width="128.9" height="30" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.2"/><text x="450.0" y="46.0" font-size="13" font-style="italic" fill="#2b6cb0">lim</text><text x="451.0" y="56.0" font-size="8.5" fill="#2b6cb0">x→0</text><text x="501.9" y="41.0" font-size="11.5" font-style="italic" fill="#2b6cb0" text-anchor="middle">sin x</text><line x1="481.8" y1="46.5" x2="522.0" y2="46.5" stroke="#2b6cb0" stroke-width="1.3"/><text x="501.9" y="58.5" font-size="11.5" font-style="italic" fill="#2b6cb0" text-anchor="middle">x</text><text x="529.0" y="46.0" font-size="13" fill="#2b6cb0">= 1</text><path d="M 410.0,99.0 C 423.0,99.0 423.0,45.0 436.0,45.0" fill="none" stroke="#2b6cb0" stroke-width="1.7"/><rect x="436" y="68.0" rx="7" width="232.4" height="30" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.2"/><text x="450.0" y="84.0" font-size="13" fill="#263238">单位圆 r=1：sin θ = 垂直线段长</text><path d="M 410.0,99.0 C 423.0,99.0 423.0,83.0 436.0,83.0" fill="none" stroke="#2b6cb0" stroke-width="1.7"/><rect x="436" y="106.0" rx="7" width="215.2" height="30" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.2"/><text x="450.0" y="122.0" font-size="13" fill="#263238">弧度制：弧长 arc length = θ</text><path d="M 410.0,99.0 C 423.0,99.0 423.0,121.0 436.0,121.0" fill="none" stroke="#2b6cb0" stroke-width="1.7"/><rect x="436" y="144.0" rx="7" width="203.2" height="30" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="1.2"/><text x="450.0" y="160.0" font-size="13" fill="#263238">θ→0：线段 ≈ 弧，比值趋于 1</text><path d="M 410.0,99.0 C 423.0,99.0 423.0,159.0 436.0,159.0" fill="none" stroke="#2b6cb0" stroke-width="1.7"/><path d="M 210.0,366.0 C 221.0,366.0 221.0,258.0 232.0,258.0" fill="none" stroke="#2e7d32" stroke-width="1.7"/><rect x="232" y="242.0" rx="8" width="178" height="32" fill="#2e7d32"/><text x="321.0" y="263.0" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold">关键极限 2</text><rect x="436" y="208.0" rx="7" width="154.6" height="30" fill="#ecf6ed" stroke="#2e7d32" stroke-width="1.2"/><text x="450.0" y="224.0" font-size="13" font-style="italic" fill="#2e7d32">lim</text><text x="451.0" y="234.0" font-size="8.5" fill="#2e7d32">θ→0</text><text x="514.8" y="219.0" font-size="11.5" font-style="italic" fill="#2e7d32" text-anchor="middle">1 − cos θ</text><line x1="481.8" y1="224.5" x2="547.8" y2="224.5" stroke="#2e7d32" stroke-width="1.3"/><text x="514.8" y="236.5" font-size="11.5" font-style="italic" fill="#2e7d32" text-anchor="middle">θ</text><text x="554.8" y="224.0" font-size="13" fill="#2e7d32">= 0</text><path d="M 410.0,258.0 C 423.0,258.0 423.0,223.0 436.0,223.0" fill="none" stroke="#2e7d32" stroke-width="1.7"/><rect x="436" y="246.0" rx="7" width="196.5" height="30" fill="#ecf6ed" stroke="#2e7d32" stroke-width="1.2"/><text x="450.0" y="262.0" font-size="13" fill="#263238">1 − cos θ = 水平缝隙 gap</text><path d="M 410.0,258.0 C 423.0,258.0 423.0,261.0 436.0,261.0" fill="none" stroke="#2e7d32" stroke-width="1.7"/><rect x="436" y="284.0" rx="7" width="162.7" height="30" fill="#ecf6ed" stroke="#2e7d32" stroke-width="1.2"/><text x="450.0" y="300.0" font-size="13" fill="#263238">gap 比弧长更快趋于 0</text><path d="M 410.0,258.0 C 423.0,258.0 423.0,299.0 436.0,299.0" fill="none" stroke="#2e7d32" stroke-width="1.7"/><path d="M 210.0,366.0 C 221.0,366.0 221.0,455.0 232.0,455.0" fill="none" stroke="#c0392b" stroke-width="1.7"/><rect x="232" y="439.0" rx="8" width="178" height="32" fill="#c0392b"/><text x="321.0" y="460.0" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold">几何证明 (sin θ)′ = cos θ</text><rect x="436" y="348.0" rx="7" width="256.3" height="30" fill="#fbeeec" stroke="#c0392b" stroke-width="1.2"/><text x="450.0" y="364.0" font-size="13" fill="#263238">x=0 处导数 = lim sin Δx / Δx = 1</text><path d="M 410.0,455.0 C 423.0,455.0 423.0,363.0 436.0,363.0" fill="none" stroke="#c0392b" stroke-width="1.7"/><rect x="436" y="386.0" rx="7" width="187.6" height="30" fill="#fbeeec" stroke="#c0392b" stroke-width="1.2"/><text x="450.0" y="402.0" font-size="13" fill="#263238">P 对应 θ，Q 对应 θ + Δθ</text><path d="M 410.0,455.0 C 423.0,455.0 423.0,401.0 436.0,401.0" fill="none" stroke="#c0392b" stroke-width="1.7"/><rect x="436" y="424.0" rx="7" width="155.9" height="30" fill="#fbeeec" stroke="#c0392b" stroke-width="1.2"/><text x="450.0" y="440.0" font-size="13" fill="#263238">弦 PQ ≈ 弧 PQ = Δθ</text><path d="M 410.0,455.0 C 423.0,455.0 423.0,439.0 436.0,439.0" fill="none" stroke="#c0392b" stroke-width="1.7"/><rect x="436" y="462.0" rx="7" width="173.1" height="30" fill="#fbeeec" stroke="#c0392b" stroke-width="1.2"/><text x="450.0" y="478.0" font-size="13" fill="#263238">PQ 近乎切线，∠RPQ ≅ θ</text><path d="M 410.0,455.0 C 423.0,455.0 423.0,477.0 436.0,477.0" fill="none" stroke="#c0392b" stroke-width="1.7"/><rect x="436" y="500.0" rx="7" width="187.6" height="30" fill="#fbeeec" stroke="#c0392b" stroke-width="1.2"/><text x="450.0" y="516.0" font-size="13" fill="#263238">cos θ ≈ Δy/Δθ，再取极限</text><path d="M 410.0,455.0 C 423.0,455.0 423.0,515.0 436.0,515.0" fill="none" stroke="#c0392b" stroke-width="1.7"/><rect x="436" y="538.0" rx="7" width="198.0" height="30" fill="#fbeeec" stroke="#c0392b" stroke-width="1.2"/><text x="450.0" y="554.0" font-size="13" fill="#263238">结论：d/dθ sin θ = cos θ</text><path d="M 410.0,455.0 C 423.0,455.0 423.0,553.0 436.0,553.0" fill="none" stroke="#c0392b" stroke-width="1.7"/><path d="M 210.0,366.0 C 221.0,366.0 221.0,652.0 232.0,652.0" fill="none" stroke="#b36b00" stroke-width="1.7"/><rect x="232" y="636.0" rx="8" width="178" height="32" fill="#b36b00"/><text x="321.0" y="657.0" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="bold">核心方法：以直代曲</text><rect x="436" y="602.0" rx="7" width="158.0" height="30" fill="#fdf4e5" stroke="#b36b00" stroke-width="1.2"/><text x="450.0" y="618.0" font-size="13" fill="#263238">直线段逼近极短曲线段</text><path d="M 410.0,652.0 C 423.0,652.0 423.0,617.0 436.0,617.0" fill="none" stroke="#b36b00" stroke-width="1.7"/><rect x="436" y="640.0" rx="7" width="171.0" height="30" fill="#fdf4e5" stroke="#b36b00" stroke-width="1.2"/><text x="450.0" y="656.0" font-size="13" fill="#263238">弧度制是一切论证的前提</text><path d="M 410.0,652.0 C 423.0,652.0 423.0,655.0 436.0,655.0" fill="none" stroke="#b36b00" stroke-width="1.7"/><rect x="436" y="678.0" rx="7" width="222.0" height="30" fill="#fdf4e5" stroke="#b36b00" stroke-width="1.2"/><text x="450.0" y="694.0" font-size="13" fill="#263238">0/0 型：比较趋于 0 的相对速率</text><path d="M 410.0,652.0 C 423.0,652.0 423.0,693.0 436.0,693.0" fill="none" stroke="#b36b00" stroke-width="1.7"/></svg>