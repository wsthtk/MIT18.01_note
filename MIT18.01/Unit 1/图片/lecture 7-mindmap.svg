<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925 680" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="925" height="680" fill="#ffffff"/>

  <g fill="none" stroke-linecap="round">
    <!-- main trunk to 5 branches -->
    <path d="M230 340 C 268 340, 262 80, 300 80" stroke="#2563eb" stroke-width="2.6"/>
    <path d="M230 340 C 268 340, 262 205, 300 205" stroke="#ea580c" stroke-width="2.6"/>
    <path d="M230 340 L 300 330" stroke="#0d9488" stroke-width="2.6"/>
    <path d="M230 340 C 268 340, 262 455, 300 455" stroke="#7c3aed" stroke-width="2.6"/>
    <path d="M230 340 C 268 340, 262 580, 300 580" stroke="#e11d48" stroke-width="2.6"/>

    <!-- blue leaves -->
    <g stroke="#2563eb" stroke-width="1.9">
      <path d="M470 80 C 520 80, 540 55, 590 55"/>
      <path d="M470 80 C 520 80, 540 90, 590 90"/>
      <path d="M470 80 C 520 80, 540 125, 590 125"/>
    </g>
    <!-- orange leaves -->
    <g stroke="#ea580c" stroke-width="1.9">
      <path d="M470 205 C 520 205, 540 175, 590 175"/>
      <path d="M470 205 C 520 205, 540 205, 590 205"/>
      <path d="M470 205 C 520 205, 540 235, 590 235"/>
    </g>
    <!-- teal leaves -->
    <g stroke="#0d9488" stroke-width="1.9">
      <path d="M470 330 C 520 330, 540 300, 590 300"/>
      <path d="M470 330 C 520 330, 540 330, 590 330"/>
      <path d="M470 330 C 520 330, 540 365, 590 365"/>
    </g>
    <!-- purple leaves -->
    <g stroke="#7c3aed" stroke-width="1.9">
      <path d="M470 455 C 520 455, 540 440, 590 440"/>
      <path d="M470 455 C 520 455, 540 475, 590 475"/>
    </g>
    <!-- red leaves -->
    <g stroke="#e11d48" stroke-width="1.9">
      <path d="M470 580 C 520 580, 540 555, 590 555"/>
      <path d="M470 580 C 520 580, 540 585, 590 585"/>
      <path d="M470 580 C 520 580, 540 615, 590 615"/>
    </g>
  </g>

  <!-- center node -->
  <g filter="url(#shadow)">
    <rect x="30" y="300" width="200" height="80" rx="12" fill="#0f172a"/>
  </g>
  <text x="130" y="335" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Exam 1 复习</text>
  <text x="130" y="359" text-anchor="middle" fill="#94a3b8" font-size="12.5">Session 21</text>
  <text x="130" y="377" text-anchor="middle" fill="#64748b" font-size="11">求导法则总览</text>

  <!-- branch boxes -->
  <g filter="url(#shadow)">
    <rect x="300" y="58" width="170" height="44" rx="9" fill="#2563eb"/>
    <rect x="300" y="183" width="170" height="44" rx="9" fill="#ea580c"/>
    <rect x="300" y="308" width="170" height="44" rx="9" fill="#0d9488"/>
    <rect x="300" y="433" width="170" height="44" rx="9" fill="#7c3aed"/>
    <rect x="300" y="558" width="170" height="44" rx="9" fill="#e11d48"/>
  </g>
  <text x="385" y="85" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">通用求导法则</text>
  <text x="385" y="210" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">必背导数公式</text>
  <text x="385" y="335" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">例题串讲</text>
  <text x="385" y="460" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">导数定义反读</text>
  <text x="385" y="585" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">隐函数与切线</text>

  <!-- leaf boxes -->
  <g filter="url(#shadow)">
    <rect x="590" y="41" width="310" height="28" rx="6" fill="#eff6ff"/>
    <rect x="590" y="76" width="310" height="28" rx="6" fill="#eff6ff"/>
    <rect x="590" y="111" width="310" height="28" rx="6" fill="#eff6ff"/>

    <rect x="590" y="161" width="310" height="28" rx="6" fill="#fff7ed"/>
    <rect x="590" y="191" width="310" height="28" rx="6" fill="#fff7ed"/>
    <rect x="590" y="221" width="310" height="28" rx="6" fill="#fff7ed"/>

    <rect x="590" y="286" width="310" height="28" rx="6" fill="#f0fdfa"/>
    <rect x="590" y="316" width="310" height="28" rx="6" fill="#f0fdfa"/>
    <rect x="590" y="351" width="310" height="28" rx="6" fill="#f0fdfa"/>

    <rect x="590" y="426" width="310" height="28" rx="6" fill="#f5f3ff"/>
    <rect x="590" y="461" width="310" height="28" rx="6" fill="#f5f3ff"/>

    <rect x="590" y="541" width="310" height="28" rx="6" fill="#fff1f2"/>
    <rect x="590" y="571" width="310" height="28" rx="6" fill="#fff1f2"/>
    <rect x="590" y="601" width="310" height="28" rx="6" fill="#fff1f2"/>
  </g>

  <g fill="#1e293b" font-size="12.5">
    <text x="602" y="59">和/数乘：(u+v)′=u′+v′，(cu)′=cu′</text>
    <text x="602" y="94">乘积/商：(uv)′=u′v+uv′；(u/v)′=(u′v−uv′)/v²</text>
    <text x="602" y="129">链式：d/dx f(u(x))=f′(u)·u′(x)，率相乘</text>

    <text x="602" y="179">xⁿ、sin/cos/tan、sec、eˣ、ln x</text>
    <text x="602" y="209">arcsin x=1/√(1−x²)；arctan x=1/(1+x²)</text>
    <text x="602" y="239">两个极限：sin h/h→1，(cos h−1)/h→0</text>

    <text x="602" y="304">(sec x)′=sec x·tan x（链式推）</text>
    <text x="602" y="334">(ln sec x)′=tan x；(x¹⁰+8x)⁶</text>
    <text x="602" y="369">e^(x·arctan x)：指数照抄，再乘乘积法则</text>

    <text x="602" y="444">f′(x)=lim[f(x+Δx)−f(x)]/Δx</text>
    <text x="602" y="479">反读：(eᵘ−1)/u→1（即 eˣ 在 0 处斜率）</text>

    <text x="602" y="559">隐式推 arcsin：sin y=x→y′=1/√(1−x²)</text>
    <text x="602" y="589">导数=切线斜率；可微⇄左右割线极限相同</text>
    <text x="602" y="619">画 y=ln x 的切线→其斜率即 y′=1/x</text>
  </g>
</svg>
