<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 925 930" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="2.2" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="925" height="930" fill="#ffffff"/>

  <g fill="none" stroke-linecap="round">
    <path d="M230 465 C 268 465, 262 110, 300 110" stroke="#2563eb" stroke-width="2.6"/>
    <path d="M230 465 C 268 465, 262 295, 300 295" stroke="#ea580c" stroke-width="2.6"/>
    <path d="M230 465 L 300 465" stroke="#0d9488" stroke-width="2.6"/>
    <path d="M230 465 C 268 465, 262 640, 300 640" stroke="#7c3aed" stroke-width="2.6"/>
    <path d="M230 465 C 268 465, 262 820, 300 820" stroke="#e11d48" stroke-width="2.6"/>

    <g stroke="#2563eb" stroke-width="1.9">
      <path d="M500 110 C 536 110, 554 60, 590 60"/>
      <path d="M500 110 C 536 110, 554 115, 590 115"/>
      <path d="M500 110 C 536 110, 554 170, 590 170"/>
    </g>
    <g stroke="#ea580c" stroke-width="1.9">
      <path d="M500 295 C 536 295, 554 245, 590 245"/>
      <path d="M500 295 C 536 295, 554 300, 590 300"/>
      <path d="M500 295 C 536 295, 554 355, 590 355"/>
    </g>
    <g stroke="#0d9488" stroke-width="1.9">
      <path d="M500 465 C 536 465, 554 420, 590 420"/>
      <path d="M500 465 C 536 465, 554 470, 590 470"/>
      <path d="M500 465 C 536 465, 554 525, 590 525"/>
    </g>
    <g stroke="#7c3aed" stroke-width="1.9">
      <path d="M500 640 C 536 640, 554 610, 590 610"/>
      <path d="M500 640 C 536 640, 554 670, 590 670"/>
    </g>
    <g stroke="#e11d48" stroke-width="1.9">
      <path d="M500 820 C 536 820, 554 785, 590 785"/>
      <path d="M500 820 C 536 820, 554 835, 590 835"/>
      <path d="M500 820 C 536 820, 554 885, 590 885"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="30" y="425" width="200" height="80" rx="12" fill="#0f172a"/>
  </g>
  <text x="130" y="458" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">指数函数与对数</text>
  <text x="130" y="482" text-anchor="middle" fill="#94a3b8" font-size="12.5">Session 16-20</text>
  <text x="130" y="500" text-anchor="middle" fill="#64748b" font-size="11">（含双曲函数）</text>

  <text x="130" y="540" text-anchor="middle" fill="#92400e" font-size="11.5" font-style="italic">核心：先承认 e^x 的导数是自己，</text>
  <text x="130" y="557" text-anchor="middle" fill="#92400e" font-size="11.5" font-style="italic">再反推出 M(a) = ln a</text>

  <g filter="url(#shadow)">
    <rect x="300" y="80" width="200" height="60" rx="10" fill="#2563eb"/>
  </g>
  <text x="400" y="106" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">Session 16</text>
  <text x="400" y="127" text-anchor="middle" fill="#dbeafe" font-size="12.5">a^x 的导数与 M(a)</text>

  <g filter="url(#shadow)">
    <rect x="300" y="265" width="200" height="60" rx="10" fill="#ea580c"/>
  </g>
  <text x="400" y="291" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">Session 17</text>
  <text x="400" y="312" text-anchor="middle" fill="#ffedd5" font-size="12.5">数 e 与 ln x</text>

  <g filter="url(#shadow)">
    <rect x="300" y="435" width="200" height="60" rx="10" fill="#0d9488"/>
  </g>
  <text x="400" y="461" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">Session 18</text>
  <text x="400" y="482" text-anchor="middle" fill="#ccfbf1" font-size="12.5">对数求导法</text>

  <g filter="url(#shadow)">
    <rect x="300" y="610" width="200" height="60" rx="10" fill="#7c3aed"/>
  </g>
  <text x="400" y="636" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">Session 19</text>
  <text x="400" y="657" text-anchor="middle" fill="#ede9fe" font-size="12.5">涉及 e 的极限</text>

  <g filter="url(#shadow)">
    <rect x="300" y="790" width="200" height="60" rx="10" fill="#e11d48"/>
  </g>
  <text x="400" y="816" text-anchor="middle" fill="#ffffff" font-size="14.5" font-weight="700">Session 20</text>
  <text x="400" y="837" text-anchor="middle" fill="#ffe4e6" font-size="12.5">双曲函数</text>

  <g font-size="13.5" fill="#1e293b">
    <rect x="590" y="42" width="300" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="605" y="66">M(a) = lim (a^dx - 1)/dx</text>
    <rect x="590" y="97" width="300" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="605" y="121">d/dx a^x = M(a) * a^x</text>
    <rect x="590" y="152" width="300" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="605" y="176">M(a) = x=0 处切线斜率</text>

    <rect x="590" y="227" width="300" height="36" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="605" y="251">M(e)=1  =>  d/dx e^x = e^x</text>
    <rect x="590" y="282" width="300" height="36" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="605" y="306">隐函数求导 => d/dx ln x = 1/x</text>
    <rect x="590" y="337" width="300" height="36" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="605" y="361">结论：M(a) = ln a</text>

    <rect x="590" y="402" width="300" height="36" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="605" y="426">d/dx a^x = (ln a) * a^x</text>
    <rect x="590" y="452" width="300" height="36" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="605" y="476">对数求导：(ln u)' = u'/u</text>
    <rect x="590" y="507" width="300" height="36" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="605" y="531">x^x 的导数 = x^x (1 + ln x)</text>

    <rect x="590" y="592" width="300" height="36" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="605" y="616">取 ln 把指数拉下来</text>
    <rect x="590" y="652" width="300" height="36" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="605" y="676">lim (1 + 1/n)^n = e</text>

    <rect x="590" y="767" width="300" height="36" rx="8" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="605" y="791">sinh x = (e^x - e^(-x))/2</text>
    <rect x="590" y="817" width="300" height="36" rx="8" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="605" y="841">cosh x = (e^x + e^(-x))/2</text>
    <rect x="590" y="862" width="300" height="36" rx="8" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="605" y="886">(sinh)'=cosh，(cosh)'=sinh</text>
  </g>
</svg>
